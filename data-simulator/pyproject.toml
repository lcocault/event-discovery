[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-simulator"
version = "0.1.0"
description = "A Python project to simulate family data generation"
authors = [
    { name = "Laurent Cocault" }
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "osmium>=3.6.0",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"