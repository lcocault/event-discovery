name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies (location)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./location

      - name: Generate API (location)
        run: uv run src/api/generate_api.py
        working-directory: ./location

      - name: Run Python tests (location)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./location

      - name: Install Python dependencies (event)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./event

      - name: Generate API (event)
        run: uv run src/api/generate_api.py
        working-directory: ./event

      - name: Run Python tests (event)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./event

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Node.js dependencies (wui)
        run: npm install
        working-directory: ./wui

      - name: Run JavaScript tests (wui)
        run: npm test
        working-directory: ./wui

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build FastAPI server on target server without sudo
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@ssh-cocault.alwaysdata.net \
          "mkdir -p ~/python-build && cd ~/python-build && \
           wget https://www.python.org/ftp/python/3.11.6/Python-3.11.6.tgz && \
           tar -xzf Python-3.11.6.tgz && cd Python-3.11.6 && \
           ./configure --prefix=$HOME/python --enable-optimizations && make -j$(nproc) && make install && \
           ~/python/bin/python3.11 -m pip install --upgrade pip setuptools wheel && \
           ~/python/bin/python3.11 -m pip install pyinstaller fastapi && \
           ~/python/bin/python3.11 -m pip install . && \
           ~/python/bin/python3.11 src/api/generate_api.py && \
           ~/python/bin/pyinstaller --onefile --hidden-import fastapi src/event/server.py && \
           chmod +x dist/server"
