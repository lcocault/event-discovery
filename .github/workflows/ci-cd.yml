name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies (location)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./location

      - name: Generate API (location)
        run: uv run src/api/generate_api.py
        working-directory: ./location

      - name: Run Python tests (location)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./location

      - name: Install Python dependencies (event)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./event

      - name: Generate API (event)
        run: uv run src/api/generate_api.py
        working-directory: ./event

      - name: Run Python tests (event)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./event

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Node.js dependencies (wui)
        run: npm install
        working-directory: ./wui

      - name: Run JavaScript tests (wui)
        run: npm test
        working-directory: ./wui

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy FastAPI source code and setup script via FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set ssl:verify-certificate no; open ftp-cocault.alwaysdata.net; user $FTP_USERNAME $FTP_PASSWORD; \
          mirror --reverse --delete ./event /home/cocault/event-server; \
          put ./event/setup_server.sh -o /home/cocault/event-server/setup_server.sh; \
          bye"

      - name: Instructions for Manual Setup
        run: |
          echo "The source code and setup script have been uploaded."
          echo "Please log in to the server and execute the following commands manually:"
          echo "1. Navigate to the deployment directory: cd /home/cocault/event-server"
          echo "2. Make the setup script executable: chmod +x setup_server.sh"
          echo "3. Run the setup script: ./setup_server.sh"
