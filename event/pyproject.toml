[project]
name = "event"
version = "0.1.0"
description = "Event definitions and extraction logic for event-discovery."
authors = [
    { name = "Laurent Cocault" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uv",
    "uvicorn"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
