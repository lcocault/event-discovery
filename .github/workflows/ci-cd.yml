name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies (location)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./location

      - name: Generate API (location)
        run: uv run src/api/generate_api.py
        working-directory: ./location

      - name: Run Python tests (location)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./location

      - name: Install Python dependencies (event)
        run: |
          python -m pip install --upgrade pip
          pip install .
        working-directory: ./event

      - name: Generate API (event)
        run: uv run src/api/generate_api.py
        working-directory: ./event

      - name: Run Python tests (event)
        env:
          PYTHONPATH: "src"
        run: |
          pytest
        working-directory: ./event

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Node.js dependencies (wui)
        run: npm install
        working-directory: ./wui

      - name: Run JavaScript tests (wui)
        run: npm test
        working-directory: ./wui

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build FastAPI server with pyinstaller in compatible environment
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace/event \
            debian:bullseye \
            bash -c "apt-get update && apt-get install -y python3 python3-pip python3-venv gcc && \
                     python3 -m pip install --upgrade pip && \
                     pip install pyinstaller fastapi && \
                     python3 src/api/generate_api.py && \
                     pyinstaller --onefile --hidden-import fastapi src/event/server.py && \
                     chmod +x dist/server"

      - name: Deploy FastAPI server executable via FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set ssl:verify-certificate no; open ftp-cocault.alwaysdata.net; user $FTP_USERNAME $FTP_PASSWORD; \
          put ./event/dist/server; \
          bye"
