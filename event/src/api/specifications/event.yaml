openapi: 3.0.3
info:
  title: Event API
  version: 1.0.0
  description: API to retrieve information about events.
paths:
  /events/{event_id}:
    get:
      summary: Get event by ID
      description: Retrieve detailed information about an event using its unique identifier.
      parameters:
        - name: event_id
          in: path
          required: true
          description: Unique identifier of the event
          schema:
            type: string
      responses:
        '200':
          description: Successful response with event information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
  /events/around:
    get:
      summary: Get events around a position and time
      description: Retrieve events near a given latitude, longitude, and time.
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude of the position
          schema:
            type: number
            format: float
        - name: longitude
          in: query
          required: true
          description: Longitude of the position
          schema:
            type: number
            format: float
        - name: time
          in: query
          required: true
          description: ISO 8601 timestamp for the search
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of events near the position and time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Invalid parameters
components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the event
        name:
          type: string
          description: Name of the event
        latitude:
          type: number
          format: float
          description: Latitude of the event location
        longitude:
          type: number
          format: float
          description: Longitude of the event location
        start_time:
          type: string
          format: date-time
          description: Start time of the event
        end_time:
          type: string
          format: date-time
          description: End time of the event
      required:
        - id
        - name
        - latitude
        - longitude
